[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-contentops-studio"
version = "0.1.0"
description = "AI research, evaluation, and publishing automation platform for technical content operations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zack Wang" }]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.20",
  "python-slugify>=8.0.4",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "types-PyYAML>=6.0.12",
]
aws = [
  "boto3>=1.34.0",
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
contentops = "contentops_cli.main:app"
contentops-worker = "contentops_worker.main:app"

[tool.setuptools.packages.find]
where = [
  "apps/api",
  "apps/cli",
  "apps/worker",
  "packages/core",
  "packages/providers",
  "packages/evaluators",
  "packages/publishing",
  "packages/observability",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "apps/cli",
  "apps/worker",
  "packages/core",
  "packages/providers",
  "packages/evaluators",
  "packages/publishing",
  "packages/observability",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["contentops_cli.main"]
disable_error_code = ["no-untyped-call"]
