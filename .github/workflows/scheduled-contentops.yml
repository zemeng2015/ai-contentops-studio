name: Scheduled ContentOps

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 0 * * 1"
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Pipeline to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - project-updates
          - all
      dry_run_only:
        description: "Validate and dry-run without executing the worker"
        required: true
        default: true
        type: boolean
      create_review_issue:
        description: "Create a GitHub issue with the workflow review packet"
        required: true
        default: false
        type: boolean
      create_draft_pr:
        description: "Create a draft PR with scheduled review metadata"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CONTENTOPS_ARTIFACT_ROOT: artifacts
  CONTENTOPS_DATABASE_URL: sqlite:///scheduled-contentops.db
  CONTENTOPS_SITE_OUTPUT_DIR: site
  CONTENTOPS_PUBLIC_BASE_URL: https://zemeng2015.github.io/ai-contentops-studio
  CONTENTOPS_RESEARCH_SEARCH_API_KEY: ${{ secrets.CONTENTOPS_RESEARCH_SEARCH_API_KEY }}
  CONTENTOPS_RESEARCH_GITHUB_TOKEN: ${{ secrets.CONTENTOPS_RESEARCH_GITHUB_TOKEN }}
  CONTENTOPS_OPENAI_API_KEY: ${{ secrets.CONTENTOPS_OPENAI_API_KEY }}
  CONTENTOPS_NOTIFICATION_WEBHOOK_URL: ${{ secrets.CONTENTOPS_NOTIFICATION_WEBHOOK_URL }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  daily-ai-roundup:
    name: Daily AI roundup
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.pipeline == 'daily' || inputs.pipeline == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Prepare artifact directories
        run: mkdir -p artifacts/job-executions artifacts/release-evidence scheduled-worker
      - name: Worker readiness gate
        run: contentops worker-job-readiness --json | tee scheduled-worker/readiness.json
      - name: Worker dry run
        run: |
          contentops-worker run-pipeline pipelines/daily_ai_roundup.yaml \
            --dry-run \
            --json \
            --receipt-dir artifacts/job-executions \
            | tee scheduled-worker/daily-dry-run.json
      - name: Execute worker
        if: github.event_name == 'schedule' || inputs.dry_run_only == false
        run: |
          contentops-worker run-pipeline pipelines/daily_ai_roundup.yaml \
            --receipt-dir artifacts/job-executions \
            --release-evidence-dir artifacts/release-evidence/daily-ai-roundup \
            | tee scheduled-worker/daily-execution.txt
      - name: Notify worker alerts
        if: always() && (github.event_name == 'schedule' || inputs.dry_run_only == false)
        run: contentops job-execution-alert-notify --days 7 | tee scheduled-worker/daily-alert.json
      - name: Archive ops brief notifications
        if: always() && (github.event_name == 'schedule' || inputs.dry_run_only == false)
        run: |
          if [ -f artifacts/ops-brief-notification-log.json ]; then
            cp artifacts/ops-brief-notification-log.json scheduled-worker/daily-ops-brief-notifications.json
          fi
      - name: Write operations console snapshot
        if: always()
        run: contentops operations-console --days 14 --json | tee scheduled-worker/daily-operations-console.json
      - name: Write workflow review summary
        if: always()
        run: |
          contentops scheduled-workflow-summary \
            --limit 5 \
            --output scheduled-worker/daily-review.md \
            --pr-metadata-output scheduled-worker/daily-pr-metadata.json \
            --manifest-output scheduled-worker/daily-review-manifest.json \
            --operations-console-path scheduled-worker/daily-operations-console.json
          cat scheduled-worker/daily-review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create review issue
        if: always() && github.event_name == 'workflow_dispatch' && inputs.create_review_issue == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat scheduled-worker/daily-review.md
          } > scheduled-worker/daily-review-issue.md
          gh issue create \
            --title "Scheduled ContentOps review: daily AI roundup #${GITHUB_RUN_NUMBER}" \
            --body-file scheduled-worker/daily-review-issue.md
      - name: Create draft PR
        if: always() && github.event_name == 'workflow_dispatch' && inputs.create_draft_pr == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="contentops/scheduled-daily-${GITHUB_RUN_ID}"
          mkdir -p scheduled-reviews
          cp scheduled-worker/daily-review.md "scheduled-reviews/daily-${GITHUB_RUN_ID}.md"
          cp scheduled-worker/daily-pr-metadata.json "scheduled-reviews/daily-${GITHUB_RUN_ID}.json"
          cp scheduled-worker/daily-review-manifest.json "scheduled-reviews/daily-${GITHUB_RUN_ID}-manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("scheduled-worker/daily-pr-metadata.json").read_text())
          Path("scheduled-worker/daily-pr-title.txt").write_text(metadata["title"])
          Path("scheduled-worker/daily-pr-body.md").write_text(metadata["body"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scheduled-reviews
          git commit -m "Add scheduled daily ContentOps review ${GITHUB_RUN_ID}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "$(cat scheduled-worker/daily-pr-title.txt)" \
            --body-file scheduled-worker/daily-pr-body.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduled-contentops-daily
          path: |
            scheduled-worker/**
            artifacts/job-executions/**
            artifacts/release-evidence/**
            site/**

  project-repository-updates:
    name: Project repository updates
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '30 0 * * 1' ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.pipeline == 'project-updates' || inputs.pipeline == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Prepare artifact directories
        run: mkdir -p artifacts/job-executions artifacts/release-evidence scheduled-worker
      - name: Worker readiness gate
        run: contentops worker-job-readiness --json | tee scheduled-worker/readiness.json
      - name: Worker dry run
        run: |
          contentops-worker run-pipeline pipelines/project_repository_updates.yaml \
            --dry-run \
            --json \
            --receipt-dir artifacts/job-executions \
            | tee scheduled-worker/project-updates-dry-run.json
      - name: Execute worker
        if: github.event_name == 'schedule' || inputs.dry_run_only == false
        run: |
          contentops-worker run-pipeline pipelines/project_repository_updates.yaml \
            --receipt-dir artifacts/job-executions \
            --release-evidence-dir artifacts/release-evidence/project-repository-updates \
            | tee scheduled-worker/project-updates-execution.txt
      - name: Notify worker alerts
        if: always() && (github.event_name == 'schedule' || inputs.dry_run_only == false)
        run: contentops job-execution-alert-notify --days 7 | tee scheduled-worker/project-updates-alert.json
      - name: Archive ops brief notifications
        if: always() && (github.event_name == 'schedule' || inputs.dry_run_only == false)
        run: |
          if [ -f artifacts/ops-brief-notification-log.json ]; then
            cp artifacts/ops-brief-notification-log.json scheduled-worker/project-updates-ops-brief-notifications.json
          fi
      - name: Write operations console snapshot
        if: always()
        run: contentops operations-console --days 14 --json | tee scheduled-worker/project-updates-operations-console.json
      - name: Write workflow review summary
        if: always()
        run: |
          contentops scheduled-workflow-summary \
            --limit 5 \
            --output scheduled-worker/project-updates-review.md \
            --pr-metadata-output scheduled-worker/project-updates-pr-metadata.json \
            --manifest-output scheduled-worker/project-updates-review-manifest.json \
            --operations-console-path scheduled-worker/project-updates-operations-console.json
          cat scheduled-worker/project-updates-review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create review issue
        if: always() && github.event_name == 'workflow_dispatch' && inputs.create_review_issue == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat scheduled-worker/project-updates-review.md
          } > scheduled-worker/project-updates-review-issue.md
          gh issue create \
            --title "Scheduled ContentOps review: project updates #${GITHUB_RUN_NUMBER}" \
            --body-file scheduled-worker/project-updates-review-issue.md
      - name: Create draft PR
        if: always() && github.event_name == 'workflow_dispatch' && inputs.create_draft_pr == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="contentops/scheduled-project-updates-${GITHUB_RUN_ID}"
          mkdir -p scheduled-reviews
          cp scheduled-worker/project-updates-review.md "scheduled-reviews/project-updates-${GITHUB_RUN_ID}.md"
          cp scheduled-worker/project-updates-pr-metadata.json "scheduled-reviews/project-updates-${GITHUB_RUN_ID}.json"
          cp scheduled-worker/project-updates-review-manifest.json "scheduled-reviews/project-updates-${GITHUB_RUN_ID}-manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("scheduled-worker/project-updates-pr-metadata.json").read_text())
          Path("scheduled-worker/project-updates-pr-title.txt").write_text(metadata["title"])
          Path("scheduled-worker/project-updates-pr-body.md").write_text(metadata["body"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scheduled-reviews
          git commit -m "Add scheduled project ContentOps review ${GITHUB_RUN_ID}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "$(cat scheduled-worker/project-updates-pr-title.txt)" \
            --body-file scheduled-worker/project-updates-pr-body.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduled-contentops-project-updates
          path: |
            scheduled-worker/**
            artifacts/job-executions/**
            artifacts/release-evidence/**
            site/**
