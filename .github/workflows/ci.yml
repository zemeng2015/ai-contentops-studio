name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy apps packages tests
      - name: Database migration
        run: |
          export CONTENTOPS_DATABASE_URL=sqlite:///migration-check.db
          alembic upgrade head
      - name: Worker dry run
        run: |
          contentops-worker run-pipeline pipelines/daily_ai_roundup.yaml --dry-run
          contentops-worker run-pipeline pipelines/project_repository_updates.yaml --dry-run
      - name: Deployment preflight
        run: |
          export CONTENTOPS_DATABASE_URL=sqlite:///deployment-check.db
          python scripts/generate_deployment_check.py --output deployment-check/deployment-check.json
      - name: Release evidence
        run: |
          export CONTENTOPS_DATABASE_URL=sqlite:///release-evidence.db
          python scripts/generate_release_evidence.py --output-dir release-evidence
      - name: Release evidence regression
        run: |
          python scripts/check_release_evidence_regression.py \
            --evidence-dir release-evidence \
            --output release-evidence-regression/release-evidence-regression.json
      - name: Dashboard smoke
        run: |
          export CONTENTOPS_DATABASE_URL=sqlite:///dashboard-smoke.db
          python scripts/dashboard_smoke.py --output dashboard-smoke/dashboard-smoke.json
      - name: Release gate report
        run: |
          export CONTENTOPS_DATABASE_URL=sqlite:///release-gate.db
          python scripts/generate_release_gate.py \
            --output release-gate/release-gate.json \
            --checklist-output release-gate/deployment-checklist.md \
            --git-sha "$GITHUB_SHA" \
            --no-require-approval
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-check-py${{ matrix.python-version }}
          path: deployment-check/deployment-check.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-py${{ matrix.python-version }}
          path: release-evidence/*.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-regression-py${{ matrix.python-version }}
          path: release-evidence-regression/release-evidence-regression.json
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-smoke-py${{ matrix.python-version }}
          path: dashboard-smoke/dashboard-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-gate-py${{ matrix.python-version }}
          path: |
            release-gate/release-gate.json
            release-gate/deployment-checklist.md
      - name: Test
        run: |
          pytest \
            --cov=apps \
            --cov=packages \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=75
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile -t ai-contentops-studio:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Repository security baseline
        run: python scripts/check_security_baseline.py --output security-baseline/security-baseline.json
      - name: Python dependency audit
        run: |
          mkdir -p security-baseline
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --skip-editable --format json --output security-baseline/pip-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-baseline
          path: security-baseline/*.json

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate -no-color
