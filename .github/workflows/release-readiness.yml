name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "GitHub environment to evaluate"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      git_sha:
        description: "Candidate git SHA. Defaults to the workflow SHA."
        required: false
        default: ""
      require_approval:
        description: "Require a matching release approval record"
        required: true
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CONTENTOPS_ARTIFACT_ROOT: artifacts
  CONTENTOPS_DATABASE_URL: sqlite:///release-readiness.db
  CONTENTOPS_SITE_OUTPUT_DIR: site

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Database migration
        run: alembic upgrade head
      - name: Deployment preflight
        run: python scripts/generate_deployment_check.py --output release-readiness/deployment-check.json
      - name: Release evidence
        run: python scripts/generate_release_evidence.py --output-dir release-readiness/release-evidence
      - name: Evidence regression
        run: |
          python scripts/check_release_evidence_regression.py \
            --evidence-dir release-readiness/release-evidence \
            --output release-readiness/release-evidence-regression.json
      - name: Compare release evidence
        run: |
          python scripts/compare_release_evidence.py \
            --base-dir previous-release-evidence \
            --candidate-dir release-readiness/release-evidence \
            --allow-missing-base \
            --output release-readiness/release-evidence-comparison.json
      - name: Release gate
        run: |
          candidate_sha="${{ inputs.git_sha }}"
          if [ -z "$candidate_sha" ]; then
            candidate_sha="$GITHUB_SHA"
          fi
          approval_flag=()
          if [ "${{ inputs.require_approval }}" != "true" ]; then
            approval_flag+=(--no-require-approval)
          fi
          python scripts/generate_release_gate.py \
            --output release-readiness/release-gate.json \
            --checklist-output release-readiness/deployment-checklist.md \
            --git-sha "$candidate_sha" \
            --strict \
            "${approval_flag[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-readiness-${{ inputs.environment_name }}
          path: release-readiness/**
